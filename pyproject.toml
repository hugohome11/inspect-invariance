[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inspect-invariance"
version = "0.1.0"
description = "Measurement invariance and DIF testing for multilingual LLM benchmarks, as an Inspect extension"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Milos Kankaras" }]
keywords = ["evals", "inspect", "psychometrics", "measurement-invariance", "dif", "ai-safety"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.24", "scipy>=1.10", "inspect_ai>=0.3"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
inspect-invariance = "inspect_invariance.cli:main"

[project.urls]
Homepage = "https://github.com/hugohome11/inspect-invariance"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
inspect_invariance = ["data/**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
